name: Controle wedstrijdschema

on:
  schedule:
    - cron: "7,22,37,52 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  controle:
    runs-on: ubuntu-latest

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies installeren
        run: |
          pip install -r requirements.txt

      - name: Wedstrijdschema controleren
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python check_schedule.py

      - name: Gewijzigd schema opslaan
        run: |
          git config user.name "Schedule Bot"
          git config user.email "schedule-bot@users.noreply.github.com"

          git add schedule.json

          git diff --cached --quiet || git commit -m "Update wedstrijdschema"

          git push
